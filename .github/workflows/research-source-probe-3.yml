name: Research Source Access Probe 3

on:
  push:
    branches: [research-source-probe]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install standalone Playwright
        run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Probe AnyFlip and TriggerPoints in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          const fs = require('fs');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({
              viewport:{width:1280,height:900},
              userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
            });
            const urls = [
              ['anyflip','https://online.anyflip.com/hjtlg/tlbh/mobile/index.html'],
              ['triggerpoints','https://www.triggerpoints.net/information']
            ];
            fs.mkdirSync('source-probe-artifacts',{recursive:true});
            for (const [name,url] of urls) {
              const page = await context.newPage();
              const failures=[];
              page.on('requestfailed', r=>failures.push(`${r.failure()?.errorText || 'failed'} ${r.url()}`));
              try {
                const resp = await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
                await page.waitForTimeout(8000);
                const title = await page.title().catch(()=> '');
                const finalUrl = page.url();
                const body = await page.locator('body').innerText({timeout:10000}).catch(()=> '');
                const links = await page.locator('a').evaluateAll(as=>as.slice(0,150).map(a=>({text:(a.innerText||a.textContent||'').trim(),href:a.href}))).catch(()=>[]);
                const frames = page.frames().map(f=>f.url());
                const summary = {requestedUrl:url,status:resp ? resp.status() : null,finalUrl,title,bodyPreview:body.slice(0,20000),links,frames,requestFailures:failures.slice(0,100)};
                fs.writeFileSync(`source-probe-artifacts/${name}.json`, JSON.stringify(summary,null,2));
                fs.writeFileSync(`source-probe-artifacts/${name}.html`, await page.content());
                await page.screenshot({path:`source-probe-artifacts/${name}.png`,fullPage:true});
                console.log(`=== ${name.toUpperCase()} ===`);
                console.log(JSON.stringify({status:summary.status,finalUrl,title,bodyPreview:summary.bodyPreview.slice(0,5000),frames,requestFailures:summary.requestFailures},null,2));
              } catch (e) {
                fs.writeFileSync(`source-probe-artifacts/${name}-error.txt`, String(e && e.stack || e));
                console.error(`${name} ERROR`, e);
              } finally { await page.close(); }
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-source-probe-3
          path: source-probe-artifacts/
          if-no-files-found: warn
