name: Live Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-smoke.yml'
      - 'index.html'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'icon.svg'
      - 'data-*.js'
      - 'reasoning.js'
      - 'app-*.js'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    env:
      LIVE_SMOKE_URL: https://phshbone.github.io/bills-NMT/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for deployed app
        run: |
          for i in {1..18}; do
            if curl -fsSL "$LIVE_SMOKE_URL" | grep -q 'Clinical Reasoning Map'; then
              exit 0
            fi
            sleep 10
          done
          echo 'Deployed app did not become available in the verification window.'
          exit 1

      - name: Run live smoke test
        run: npm run test:live-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
