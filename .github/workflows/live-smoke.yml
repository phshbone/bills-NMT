name: Live Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-smoke.yml'
      - 'index.html'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'icon.svg'
      - 'assets/**'
      - 'data-*.js'
      - 'reasoning.js'
      - 'reasoning-neutral.js'
      - 'app*.js'
      - '*-ui.js'
      - 'visual-overrides.js'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    env:
      LIVE_SMOKE_URL: https://phshbone.github.io/bills-NMT/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for exact deployed build
        shell: bash
        run: |
          set -euo pipefail
          files=(index.html reasoning.js reasoning-neutral.js app.js relationship-ui.js intervention-ui.js visual-ui.js reasoning-visual-ui.js attachment-ui.js ux-repair-ui.js visual-overrides.js data-movements-1.js data-movements-2.js data-relationships-1.js data-skeletal-1.js data-interventions-1.js data-visuals-1.js data-attachments-1.js data-pathways-1.js service-worker.js assets/anatomy/iliopsoas.webp assets/anatomy/quadratus-lumborum.webp assets/anatomy/scalenes.webp assets/anatomy/serratus-anterior.webp)
          for i in {1..24}; do
            all_match=1
            for file in "${files[@]}"; do
              if ! curl -fsSL -H 'Cache-Control: no-cache' "$LIVE_SMOKE_URL$file?build=$GITHUB_SHA" -o "/tmp/deployed-${file//\//-}"; then
                all_match=0
                break
              fi
              if ! cmp -s "$file" "/tmp/deployed-${file//\//-}"; then
                all_match=0
                break
              fi
            done
            if [ "$all_match" -eq 1 ]; then
              echo "Exact deployed build matches $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages did not publish the exact tested build."
          exit 1

      - name: Run live smoke test
        run: npm run test:live-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14