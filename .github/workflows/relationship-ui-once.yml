name: Relationship UI Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/relationship-ui-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch files
        run: node scripts/patch-relationship-ui.js
      - name: Validate app source
        run: |
          node --check app.js
          git diff --check
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js app.js tests/live-smoke.spec.js
          git commit -m 'Expose upper-quarter relationship traversal'
          git push origin HEAD:main
